name: Phase 0 CI

on:
  pull_request:
  push:
    branches: [main, dev/phase-0-implementation]

jobs:
  web-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check api worker tests
      - run: python -m ruff format --check api worker tests
      - run: python -m mypy api worker
      - run: python -m pytest

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [web-quality, python-quality]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build -d
      - run: docker compose run --rm api alembic upgrade head
      - run: ./scripts/smoke.sh
      - name: Upload service logs
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down --volumes
